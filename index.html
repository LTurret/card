<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>✨</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #191919;
        touch-action: none;
      }
      body.light {
        background: #fcfcfc;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .card-image {
        display: none;
      }
      #theme-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: rgba(128, 128, 128, 0.16);
        color: inherit;
        font: 600 14px sans-serif;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <button id="theme-toggle" aria-label="Toggle theme">O</button>
    <img id="card-front" class="card-image" src="./assets/front.webp" alt="" />
    <img id="card-back" class="card-image" src="./assets/back.webp" alt="" />
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

      const CONFIG = {
        width: 6,
        height: 3.78,
        depth: 0.01,
        cornerRadius: 0.17,
        cornerSegments: 10,
        dragStrength: 0.0035,
        maxAngularVelocity: 0.12,
        angularDamping: 0.84,
        dragDamping: 0.78,
        snapStrength: 0.075,
        snapDamping: 0.82,
        cornerPressure: 0.085,
        maxTiltX: 0.1,
        maxTiltZ: 0.1,
        pressureReturnSpeed: 0.075,
        cameraDistance: 8.5,
        cameraLerpSpeed: 0.08,
        viewportPadding: 1.06,
        ambientIntensity: 1.5,
        keyLightIntensity: 2.6,
        rimLightIntensity: 1.8,
      };

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        35,
        innerWidth / innerHeight,
        0.1,
        100,
      );
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        premultipliedAlpha: true,
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, CONFIG.ambientIntensity));

      const keyLight = new THREE.DirectionalLight(
        0xffffff,
        CONFIG.keyLightIntensity,
      );
      keyLight.position.set(4, 5, 7);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(
        0xffffff,
        CONFIG.rimLightIntensity,
      );
      rimLight.position.set(-4, 2, -5);
      scene.add(rimLight);

      const card = new THREE.Group();
      scene.add(card);

      const bodyGeometry = new RoundedBoxGeometry(
        CONFIG.width,
        CONFIG.height,
        CONFIG.depth,
        CONFIG.cornerSegments,
        CONFIG.cornerRadius,
      );
      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0xe8e8e8,
        roughness: 0.48,
        metalness: 0.04,
      });
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      body.castShadow = true;
      body.receiveShadow = true;
      card.add(body);

      const frontImage = document.getElementById("card-front");
      const backImage = document.getElementById("card-back");

      function createDummyTexture(label) {
        const canvas = document.createElement("canvas");
        canvas.width = 1200;
        canvas.height = 756;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#d8d8d8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8a8a8a";
        ctx.font = "bold 72px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, canvas.width / 2, canvas.height / 2);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        return texture;
      }

      function createTexture(image, label) {
        if (!image || !image.complete || !image.naturalWidth)
          return createDummyTexture(label);
        const texture = new THREE.Texture(image);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.needsUpdate = true;
        return texture;
      }

      await new Promise((resolve) => {
        let loaded = 0;
        const done = () => {
          loaded++;
          if (loaded === 2) resolve();
        };
        frontImage.onload = done;
        frontImage.onerror = done;
        backImage.onload = done;
        backImage.onerror = done;
        if (frontImage.complete) done();
        if (backImage.complete) done();
      });

      const frontTexture = createTexture(frontImage, "FRONT");
      const backTexture = createTexture(backImage, "BACK");
      const faceGeometry = new THREE.PlaneGeometry(CONFIG.width, CONFIG.height);

      const frontMaterial = new THREE.MeshStandardMaterial({
        map: frontTexture,
        transparent: true,
        alphaTest: 0.001,
        side: THREE.FrontSide,
        roughness: 0.62,
        metalness: 0,
      });
      const backMaterial = new THREE.MeshStandardMaterial({
        map: backTexture,
        transparent: true,
        alphaTest: 0.001,
        side: THREE.FrontSide,
        roughness: 0.62,
        metalness: 0,
      });

      const front = new THREE.Mesh(faceGeometry, frontMaterial);
      front.position.z = CONFIG.depth / 2 + 0.003;

      const back = new THREE.Mesh(faceGeometry, backMaterial);
      back.position.z = -CONFIG.depth / 2 - 0.003;
      back.rotation.y = Math.PI;

      front.castShadow = true;
      front.receiveShadow = true;
      back.castShadow = true;
      back.receiveShadow = true;

      card.add(front, back);

      let dragging = false;
      let snapping = false;
      let rotationX = 0;
      let rotationY = 0;
      let targetRotationX = 0;
      let targetRotationY = 0;
      let angularVelocityX = 0;
      let angularVelocityY = 0;
      let previousPointerX = 0;
      let previousPointerY = 0;
      let pointerX = 0;
      let pointerY = 0;
      let pointerInside = false;
      let currentTiltX = 0;
      let currentTiltZ = 0;
      let orientationRotationZ = 0;
      let baseCameraDistance = CONFIG.cameraDistance;
      let manualTheme = false;

      function isPortrait() {
        return innerHeight > innerWidth;
      }

      function updateOrientation() {
        orientationRotationZ = isPortrait() ? -Math.PI / 2 : 0;
      }

      function updateResponsiveCamera() {
        const aspect = innerWidth / innerHeight;
        const portrait = isPortrait();
        const visibleWidth = portrait ? CONFIG.height : CONFIG.width;
        const visibleHeight = portrait ? CONFIG.width : CONFIG.height;
        const verticalFov = THREE.MathUtils.degToRad(camera.fov);
        const halfHeight = visibleHeight / 2;
        const halfWidth = visibleWidth / 2;
        const verticalDistance = halfHeight / Math.tan(verticalFov / 2);
        const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * aspect);
        const horizontalDistance = halfWidth / Math.tan(horizontalFov / 2);
        const requiredDistance =
          Math.max(verticalDistance, horizontalDistance) *
          CONFIG.viewportPadding;
        baseCameraDistance = Math.max(requiredDistance, CONFIG.cameraDistance);
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
      }

      function updateCamera() {
        camera.position.z +=
          (baseCameraDistance - camera.position.z) * CONFIG.cameraLerpSpeed;
      }

      function updatePointerPosition(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointerX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointerY = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
        pointerInside = true;
      }

      function getNearestSideAngle(angle) {
        return Math.round(angle / Math.PI) * Math.PI;
      }

      function startDrag(event) {
        dragging = true;
        snapping = false;
        previousPointerX = event.clientX;
        previousPointerY = event.clientY;
        angularVelocityX = 0;
        angularVelocityY = 0;
        updatePointerPosition(event);
        renderer.domElement.style.cursor = "grabbing";
        if (renderer.domElement.setPointerCapture)
          renderer.domElement.setPointerCapture(event.pointerId);
      }

      function moveDrag(event) {
        updatePointerPosition(event);
        if (!dragging) return;
        const deltaX = event.clientX - previousPointerX;
        const deltaY = event.clientY - previousPointerY;
        previousPointerX = event.clientX;
        previousPointerY = event.clientY;
        angularVelocityY += deltaX * CONFIG.dragStrength;
        angularVelocityX += deltaY * CONFIG.dragStrength;
        angularVelocityY = THREE.MathUtils.clamp(
          angularVelocityY,
          -CONFIG.maxAngularVelocity,
          CONFIG.maxAngularVelocity,
        );
        angularVelocityX = THREE.MathUtils.clamp(
          angularVelocityX,
          -CONFIG.maxAngularVelocity,
          CONFIG.maxAngularVelocity,
        );
        angularVelocityY *= CONFIG.dragDamping;
        angularVelocityX *= CONFIG.dragDamping;
        rotationY += angularVelocityY;
        rotationX += angularVelocityX;
      }

      function finishDrag(event) {
        if (!dragging) return;
        dragging = false;
        renderer.domElement.style.cursor = "grab";
        if (
          renderer.domElement.releasePointerCapture &&
          renderer.domElement.hasPointerCapture(event.pointerId)
        )
          renderer.domElement.releasePointerCapture(event.pointerId);
        targetRotationX = getNearestSideAngle(rotationX);
        targetRotationY = getNearestSideAngle(rotationY);
        snapping = true;
      }

      function cancelDrag(event) {
        if (dragging) finishDrag(event);
      }

      renderer.domElement.addEventListener("pointerdown", startDrag);
      renderer.domElement.addEventListener("pointermove", moveDrag);
      renderer.domElement.addEventListener("pointerup", finishDrag);
      renderer.domElement.addEventListener("pointercancel", cancelDrag);
      renderer.domElement.addEventListener(
        "pointerleave",
        () => (pointerInside = false),
      );
      renderer.domElement.style.cursor = "grab";

      function updatePhysics() {
        if (dragging) return;

        if (snapping) {
          const differenceX = targetRotationX - rotationX;
          const differenceY = targetRotationY - rotationY;

          angularVelocityX += differenceX * CONFIG.snapStrength;
          angularVelocityY += differenceY * CONFIG.snapStrength;

          angularVelocityX *= CONFIG.snapDamping;
          angularVelocityY *= CONFIG.snapDamping;

          angularVelocityX = THREE.MathUtils.clamp(
            angularVelocityX,
            -CONFIG.maxAngularVelocity,
            CONFIG.maxAngularVelocity,
          );
          angularVelocityY = THREE.MathUtils.clamp(
            angularVelocityY,
            -CONFIG.maxAngularVelocity,
            CONFIG.maxAngularVelocity,
          );

          rotationX += angularVelocityX;
          rotationY += angularVelocityY;

          if (
            Math.abs(differenceX) < 0.002 &&
            Math.abs(differenceY) < 0.002 &&
            Math.abs(angularVelocityX) < 0.002 &&
            Math.abs(angularVelocityY) < 0.002
          ) {
            rotationX = targetRotationX;
            rotationY = targetRotationY;
            angularVelocityX = 0;
            angularVelocityY = 0;
            snapping = false;
          }
          return;
        }

        rotationX += angularVelocityX;
        rotationY += angularVelocityY;
        angularVelocityX *= CONFIG.angularDamping;
        angularVelocityY *= CONFIG.angularDamping;

        if (Math.abs(angularVelocityX) < 0.0005) angularVelocityX = 0;
        if (Math.abs(angularVelocityY) < 0.0005) angularVelocityY = 0;
      }

      function updateCornerPressure() {
        let targetTiltX = 0;
        let targetTiltZ = 0;
        let pressure = 0;

        if (pointerInside) {
          targetTiltX = -pointerY * CONFIG.maxTiltX;
          targetTiltZ = pointerX * CONFIG.maxTiltZ;
          const distance = Math.sqrt(pointerX * pointerX + pointerY * pointerY);
          pressure = Math.min(distance, 1) * CONFIG.cornerPressure;
        }

        currentTiltX +=
          (targetTiltX - currentTiltX) * CONFIG.pressureReturnSpeed;
        currentTiltZ +=
          (targetTiltZ - currentTiltZ) * CONFIG.pressureReturnSpeed;

        card.rotation.x = rotationX + currentTiltX;
        card.rotation.y = rotationY;
        card.rotation.z = orientationRotationZ + currentTiltZ;

        if (pointerInside) {
          card.position.y +=
            (-pressure - card.position.y) * CONFIG.pressureReturnSpeed;
        } else {
          card.position.y *= 0.9;
        }
      }

      function updateFloating(time) {
        if (dragging) return;
        const floating = Math.sin(time * 0.001) * 0.012;
        if (Math.abs(card.position.y) < 0.001)
          card.position.y += (floating - card.position.y) * 0.03;
      }

      function setTheme(light) {
        document.body.classList.toggle("light", light);
        document.documentElement.style.colorScheme = light ? "light" : "dark";
        document.getElementById("theme-toggle").textContent = light ? "I" : "O";
      }

      const themeMedia = matchMedia("(prefers-color-scheme:light)");

      function applySystemTheme() {
        if (!manualTheme) setTheme(themeMedia.matches);
      }

      themeMedia.addEventListener("change", applySystemTheme);

      document.getElementById("theme-toggle").addEventListener("click", () => {
        manualTheme = true;
        setTheme(!document.body.classList.contains("light"));
      });

      setTheme(themeMedia.matches);
      updateOrientation();
      updateResponsiveCamera();

      addEventListener("resize", () => {
        renderer.setSize(innerWidth, innerHeight);
        updateOrientation();
        updateResponsiveCamera();
      });

      function animate(time) {
        requestAnimationFrame(animate);
        updatePhysics();
        updateCornerPressure();
        updateFloating(time);
        updateCamera();
        renderer.render(scene, camera);
      }

      animate(0);
    </script>
  </body>
</html>
